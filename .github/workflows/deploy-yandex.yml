name: deploy-yandex

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (по умолчанию — commit SHA)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-yandex-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ vars.YC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "${INPUT_TAG:-}" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Check and test
        run: |
          npm ci
          npm run check
          npm test

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate yc CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$YC_SA_JSON_CREDENTIALS"
          test -n "$YC_FOLDER_ID"
          umask 077
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/sa-key.json
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id "$YC_FOLDER_ID"
          yc config set format json

      - name: Build and push image
        env:
          REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          yc container registry configure-docker
          IMAGE="cr.yandex/${REGISTRY_ID}/${CONTAINER_NAME}:${TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy revision
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
          YC_SA_ID: ${{ vars.YC_SA_ID }}
          BITRIX_PORTAL_URL: ${{ vars.BITRIX_PORTAL_URL }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
        run: |
          set -euo pipefail
          yc serverless container revision deploy \
            --folder-id "$YC_FOLDER_ID" \
            --container-name "$CONTAINER_NAME" \
            --image "$IMAGE" \
            --cores 1 \
            --memory 512MB \
            --concurrency 8 \
            --execution-timeout 60s \
            --service-account-id "$YC_SA_ID" \
            --environment NODE_ENV=production \
            --environment "BITRIX_PORTAL_URL=$BITRIX_PORTAL_URL" \
            --environment "COMPANY_NAME=${COMPANY_NAME:-interpro.pro}"

      - name: Smoke-test
        env:
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
        run: |
          URL=$(yc serverless container get --folder-id "$YC_FOLDER_ID" "$CONTAINER_NAME" | jq -r .url)
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$URL/health"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -f /tmp/sa-key.json
